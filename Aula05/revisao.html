<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{border: 1px solid black;}
        div{display: inline-block;
            width: 50px; height: 50px;
        }
        .container{
            position: relative;
        }
        #a{position: fixed;
            left: 0;
            bottom: 0;
            background-color: #ff0000;
            z-index: 1;
        }
        #b{position: absolute;
            top: 0;
        }
    </style>
</head>
<body>
    <span>Aula bla</span>
    <input type="text" placeholder="entre com seus bancarios">
    <p> &lt; &gt; <span>olá mundão &nbsp; &nbsp; &nbsp; &nbsp; <mark>perdido</mark> </span> </p>
    <div class="container">
        <div id="a">A</div><div id="b">B</div>
    </div>
</body>
</html>
