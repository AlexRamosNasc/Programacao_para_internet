<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slide</title>
    <style>
        div.container{
            display: flex;
            justify-content: center;
        }
        img{
            width: 5vw; 
            height: 414px;
            margin-right: 10px;
            object-fit: cover;
            max-width: 80vw;
            border-radius: 30px;
            transition: width 0.3s ease;
            cursor: zoom-in;
        }
        #d1:hover{
            width: 740px;
            height: 415px;
            max-width: 80vw;
            max-height: 80vh; 
            cursor: zoom-out;
        }
        #d2:hover{
            width: 640px;
            height: 480px;
            max-width: 80vw;
            max-height: 80vh; 
            cursor: zoom-out;
        }
        #d3:hover{
            width: 800px;
            height: 534px;
            max-width: 80vw;
            max-height: 80vh; 
            cursor: zoom-out;
        }
        #d4:hover{
            width: 736px;
            height: 414px;
            max-width: 80vw;
            max-height: 80vh; 
            cursor: zoom-out;
        }
        #d5:hover{
            width: 800px;
            height: 532px;
            max-width: 80vw;
            max-height: 80vh; 
            cursor: zoom-out;
        }
    </style>
</head>
    <body>
        <div class="container">
            <div> <img src="Images/florest.jpeg"  id="d1"> </div>
            <div> <img src="Images/winter.jpg"  id="d2"> </div>
            <div> <img src="Images/desert.jpeg" id="d3"> </div>
            <div> <img src="Images/mountain.jpg" id="d4"> </div>
            <div> <img src="Images/ocean.jpg" id="d5"> </div>
        </div>
    </body>
</html>
