<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeiras</title>
    <style>
        body{
            background-color: rgb(202, 201, 201);
        }
        .container{
            display: flex;
            border: 1px solid black;
        }
        .bandeira{
            width: fit-content;
            margin: 15px;
            border: 1px solid black;
        }
        #japao.bandeira>div.branco{
            background-color:white;
            width: 651px;
            height: 327px;  
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #japao.bandeira>div.branco>div.vermelho{
            background-color:red;
            width: 195px;
            height: 195px;
            border-radius: 50%;
        }
        #alemanha.bandeira>div.preto{
            width: 651px;
            height: 109px;
            background-color: black;
        }
        #alemanha.bandeira>div.vermelho{
            width: 651px;
            height: 109px;
            background-color: red;
        }
        #alemanha.bandeira>div.amarelo{
            width: 651px;
            height: 109px;
            background-color: yellow;
        }
        #holanda.bandeira>div.vermelho{
            width: 651px;
            height: 109px;
            background-color: red;
        }
        #holanda.bandeira>div.branco{
            width: 651px;
            height: 109px;
            background-color: white;
        }
        #holanda.bandeira>div.azul{
            width: 651px;
            height: 109px;
            background-color: blue;
        }
        #italia.bandeira{
            display: flex;
            flex-direction: row;
        }
        #italia.bandeira>div.verde{
            width: 217px;
            height: 327px;
            background-color: green;
        }
        #italia.bandeira>div.branco{
            width: 217px;
            height: 327px;
            background-color: white;
        }
        #italia.bandeira>div.vermelho{
            width: 217px;
            height: 327px;
            background-color: red;
        }
        #brasil.bandeira>div.verde{
            width: 651px;
            height: 327px;
            background-color: green;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #brasil.bandeira>div.verde>div.amarelo{
            background-color:yellow;
            width: 500px;
            height: 250px;
            clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #brasil.bandeira>div.verde>div.amarelo>div.azul{
            background-color:blue;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #brasil.bandeira>div.verde>div.amarelo>div.azul>div.faixa{
            background-color:white;
            width: 200px;
            height: 20px;
            transform: rotate(200deg);
        }
        #index{
            margin: 15px;
        }

    </style>
</head>
<body>
    <div class="container"></div>
        <h1>Index</h1>
    
        <div id="index">
            <a href="#BJ">Bandeira Japão</a>
            <br>
            <a href="#BA">Bandeira Alemanha</a>
            <br>
            <a href="#BH">Bandeira Holanda</a>
            <br>
            <a href="#BI">Bandeira Itália</a>
            <br>
            <a href="#BB">Bandeira Brasil</a>
        </div>
    </div>

    <div class="container"></div>
        <h1 id="BJ">Bandeira do Japão</h1>
    
        <div class="bandeira" id="japao">
            <div class="branco">
                <div class="vermelho"></div>
            </div>
        </div>
    </div>

    <div class="container"></div>
            <h1 id="BA">Bandeira do Alemanha</h1>
        
            <div class="bandeira" id="alemanha">
                <div class="preto"></div>
                <div class="vermelho"></div>
                <div class="amarelo"></div>
            </div>
    </div>

    <div class="container"></div>
            <h1 id="BH">Bandeira do Holanda</h1>
        
            <div class="bandeira" id="holanda">
                <div class="vermelho"></div>
                <div class="branco"></div>
                <div class="azul"></div>
            </div>
    </div>

    <div class="container"></div>
            <h1 id="BI">Bandeira do Itália</h1>
        
            <div class="bandeira" id="italia">
                <div class="verde"></div>
                <div class="branco"></div>
                <div class="vermelho"></div>
            </div>
    </div>

    <div class="container"></div>
            <h1 id="BB">Bandeira do Brasil </h1>
        
            <div class="bandeira" id="brasil">
                <div class="verde">
                    <div class="amarelo">
                        <div class="azul">
                            <div class="faixa"></div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
</body>
</html>
