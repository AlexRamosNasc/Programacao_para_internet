<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template com Grid</title>
    <style>
        body{
            margin: 0;
        }
        #main{
            display: grid;
            grid-template-areas: 
            "header header header header"
            "menu1 section section aside1"
            "menu2 section section aside2"
            "menu2 footer footer footer"
            ;
            text-align: center;
            height: 100vh;
        }
        h1{
            margin-top: 20px;
        }
        header{
            grid-area: header;
            background-color: palegoldenrod;
            margin: 5px;
            border-radius: 10px;
        }
        section{
            grid-area: section;
            background-color: palegoldenrod;
            margin: 5px;
            border-radius: 10px;
        }
        footer{
            grid-area: footer;
            background-color: palegoldenrod;
            margin: 5px;
            border-radius: 10px;
        }
        #menu1{
            grid-area: menu1;
            background-color:crimson;
            margin: 5px;
            border-radius: 10px;
        }
        #menu2{
            grid-area: menu2;
            background-color: palegoldenrod;
            margin: 5px;
            border-radius: 10px;
        }
        #a1{
            grid-area: aside1;
            background-color:crimson;
            margin: 5px;
            border-radius: 10px;
        }
        #a2{
            grid-area: aside2;
            background-color:crimson;
            margin: 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="main">
        <header> <h1>1</h1> </header>
        <section> <h1>3</h1> </section>
        <div id="menu1"> <h1>2</h1> </div>
        <div id="menu2"> <h1>5</h1> </div>
        <aside id="a1"> <h1>4</h1> </aside>
        <aside id="a2"> <h1>6</h1> </aside>
        <footer> <h1>7</h1> </footer>
    </div>
</body>
</html>
