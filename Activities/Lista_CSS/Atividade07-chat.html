<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        div{
            border-radius: 10px;
        }
        .container{
            border: 1px solid gray;
            display: flex;
            flex-direction: column;
        }
        .nome{
            margin-top: 15px;
            margin-bottom: 0;
            display: flex;
            margin-left: 15px;
        }
        .usuario{
            display: flex;
            flex-direction: column;
            margin-right: 15px;
            margin-left: 15px;
        }
        .fala{
            margin-left: 15px;
            margin-right: 15px;
        }
        .hora{
            align-self: flex-end;
            margin-right: 15px;
        }
        #pedro, #eu{
            display: flex;
            border: 1px solid gray;
            flex-direction: column;
        }
        #eu{
            align-items: flex-end;
            background-color: rgb(183, 255, 183);
        }
        #mensagem{
            border: 1px solid gray;
            display: flex;
            justify-content: center;
            flex-direction: column;
            margin-top: 15px;
            margin-bottom: 15px;
            margin-right: 15px;
            margin-left: 15px;
        }
        #botao{
            align-self: flex-end;
            margin-top: 5px;
            margin-bottom: 15px;
            margin-right: 15px;
            margin-left: 15px;
        }
        #digite{
            align-items: stretch;
            height: 150px;
            margin-top: 15px;
            margin-right: 15px;
            margin-left: 15px;
            padding-top: 15px;
            padding-left: 15px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="usuario" id="usuario2">
            <p class="nome">Pedro Silva</p>

            <div id="pedro">
            <p class="fala">Olá, tudo bem?</p>
            <p class="hora">00:50</p>
            </div>
        </div>

        <div class="usuario" id="usuario1">
            <p class="nome" id="nomeEu">Eu</p>

            <div id="eu">
                <p class="fala">Estou bem sim, e você?</p>
                <p class="hora">00:55</p>
            </div>
        </div>

        <div class="usuario" id="usuario2">
            <p class="nome">Pedro Silva</p>

            <div id="pedro">
            <p class="fala">Vamos sair hoje? sabe converser e lorem ipsum dolor sit amet, consectetur adipiscing elit. Illum ducimus</p>
            <p class="hora">01:01</p>
            </div>
        </div>

        <div class="usuario" id="usuario1">
            <p class="nome" id="nomeEu">Eu</p>

            <div id="eu">
                <p class="fala">Criatura......</p>
                <p class="hora">00:55</p>
            </div>
        </div>

        <div id="mensagem">
            <textarea id="digite" placeholder="Digite sua mensagem"></textarea>
            <button id="botao">Enviar</button>
        </div>

    </div>
</body>
</html>
