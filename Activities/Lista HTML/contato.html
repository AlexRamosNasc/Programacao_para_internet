        <h1>Formulário de Contato</h1>

    <div>
        <h3>Por favor, preencha o formulário abaixo com seus dados para entrar em contato. Certifique-se de preencher os campos obrigatórios antes de enviar.</h3>

        <form action="" method="POST">
            <label for="nome">Nome (obrigatório):</label>
            <br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            <br><br>

            <label for="email">E-mail (obrigatório):</label>
            <br>
            <input type="email" id="email" placeholder="exemplo@dominio.com" required>
            <br><br>

            <label for="assunto">Assunto:</label>
            <br>
            <input type="text" id="assunto" name="assunto" placeholder="Sobre o que deseja falar?">
            <br><br>

            <label for="estado">Estado</label>
            <br>
            <select id="estado" name="estado">
                <option value="">Selecione seu estado</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
                <option value="SC">Santa Catarina</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="BA">Bahia</option>
            </select>
            <br><br>

            <butotn type="sunmit">Enviar</butotn>
        </form>

    </div>

</body>
</html>
