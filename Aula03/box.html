<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            border: 1px solid black;
        }
        html {
            background-color: gray;
            margin: 0px;
            padding: 0px;
            
        }
        body{
            background-color: beige;
            margin: 0px;
            height: 200vh;
        }
        p{
            display: inline-block;
            width: 100px;
            height: 100px;
            padding: 10px;
            outline: 2px dotted purple;
            outline-offset: 40px;
            background-image: url("/Programacao_para_internet/aula03/Images/star_trek.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position:25px;
        }
        #iasmim{
            margin: 50px;
            border-top-color: red;

        }
        span{
            line-height: 50px;
        }
    </style>
</head>
<body>
    <p>thiago</p><p>pedro</p>
    <p id="iasmim">iasmim</p>
    <span>Ezequiel</span>
    <span>y</span>
    <span>p</span>
</body>
</html>
