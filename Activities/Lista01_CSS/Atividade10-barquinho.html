<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação</title>
    <style>
        *{margin: 0;}
        div#ceu{
            background-color: rgb(171, 255, 255);
            height: 55vh;
        }
        div#barco{
            background-image: url("Images/barco.png");
            background-repeat: no-repeat;
            background-position: center;
            animation: balanco 2s linear 0s infinite;
            height: 40vh;
        }
        @keyframes balanco{
            0% { transform: rotate(-5deg); }
            50%  { transform: rotate(5deg); }
            100% { transform: rotate(-5deg); }
        }
        
        div#mar {
            position: relative;
            background-color: blue;
            height: 30vh;
            overflow: hidden;
        }

        div#mar::before,
        div#mar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background-image: radial-gradient(circle, transparent 40%, rgba(255, 255, 255, 0.3) 42%, transparent 44%);
            background-size: 60px 30px;
            z-index: 1;
            animation: ondas 4s linear infinite;
        }

        div#mar::after {
            background-size: 90px 45px;
            animation-duration: 6s;
            animation-direction: reverse;
            opacity: 0.6;
        }

        @keyframes ondas {
            0%   { transform: translateX(0); }
            100% { transform: translateX(60px); }
        }

        div#nuvem{
            background-color:aliceblue;
            height: 100px;
            width: 300px;
            border-radius:50px;
            box-shadow: 0 0 10px rgb(0, 0, 0);
            animation: nuvem 30s linear 0s infinite;
        }

        @keyframes nuvem {
            0% {transform: translatex(0);}
            100% {transform: translatex(80vw);}
        }

    </style>
</head>
<body>

    <div id="ceu"> <div id="nuvem"></div> <div id="barco"> </div> <div id="mar"></div> </div>

</body>
</html>
