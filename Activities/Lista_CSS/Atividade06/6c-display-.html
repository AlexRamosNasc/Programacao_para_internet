<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display B</title>
    <style>
        
        div{
            width: 100px;
            height: 100px;
        }
        #d1{
            background-color: blueviolet;
            border: 100px solid blueviolet;
            position: fixed;
            top: 0;
            left: 0px;
        }
        #d2{
            background-color: green;
            border: 100px solid green;
            position: fixed;
            top: 0;
            right: 0px;
        }
        #d3{
            background-color: red;
            border: 100px solid red;
            position: fixed;
            right: 0;
            bottom: 0;
        }
        #d4{
            background-color: yellow;
            border: 100px solid yellow;
            position: fixed;
            left: 0;
            bottom: 0px;
        }
        #d5{
            background-color: rgb(255, 71, 102);
            border: 100px solid rgb(255, 71, 102);
             position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        h1 {
            text-align:center;
        }
    </style>
</head>
<body>
    <div id="d1">
        <h1>1</h1>
    </div>
        
    <div id="d2">
        <h1>2</h1>
    </div>

    <div id="d3">
        <h1>3</h1>
    </div>

    <div id="d4">
        <h1>4</h1>
    </div>

    <div id="d5">
        <h1>5</h1>
    </div>
</body>
</html>
