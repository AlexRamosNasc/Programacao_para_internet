<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptative</title>
    <style>
        body{
            margin: 0;
        }
        div.container{
            display: grid;
            grid-template-areas: 
            "header header header"
            "leftAside banner rightAside"
            "leftAside section rightAside"
            "leftAside content rightAside"
            "footer footer footer"
            ;
            text-align: center;
            height: 100vh;
        }
        header{
            grid-area: header;
            background-color: yellow;
            margin: 5px;
        }
        div#banner{
            grid-area: banner;
            background-color: red;
            margin: 5px;
        }
        #large {
            display: none;
        }
        #small {
            display: none;
        }
        section{
            grid-area: section;
            background-color: blue;
            margin: 5px;
        }
        div#content{
            grid-area: content;
            background-color: green;
            margin: 5px;
        }
        aside#left{
            grid-area: leftAside;
            background-color: green;
            margin: 5px;
        }
        aside#right{
            grid-area: rightAside;
            background-color: yellow;
            margin: 5px;
        }
        footer{
            grid-area: footer;
            background-color: blue;
            margin: 5px;
        }

        @media screen and (min-width: 916px) and (min-height: 873px) {
            div.container{
                display: grid;
                grid-template-areas: 
                "header header header"
                "leftAside banner rightAside"
                "leftAside section rightAside"
                "leftAside content rightAside"
                "footer footer footer"
                ;
                text-align: center;
                grid-template-rows: 3fr 2fr 13fr 2fr 1fr;
                grid-template-columns: 1fr 5fr 1fr;
                height: 100vh;
            }
            header{
                grid-area: header;
                background-color: yellow;
                margin: 5px;
            }
            div#banner{
                grid-area: banner;
                background-color: red;
                margin: 5px;
            }
            #large {
                display: inline;
            }
            #small {
                display: none;
            }
            section{
                grid-area: section;
                background-color: blue;
                margin: 5px;
            }
            div#content{
                grid-area: content;
                background-color: green;
                margin: 5px;
            }
            aside#left{
                grid-area: leftAside;
                background-color: green;
                margin: 5px;
            }
            aside#right{
                grid-area: rightAside;
                background-color: yellow;
                margin: 5px;
            }
            footer{
                grid-area: footer;
                background-color: blue;
                margin: 5px;
            }
        }

        @media screen and (min-width: 437px) and (max-width: 915px) and (min-height: 873px) {
            div.container{
                display: grid;
                grid-template-areas: 
                "header header header"
                "banner banner banner"
                "leftAside leftAside leftAside"
                "section section section"
                "rightAside rightAside rightAside"
                "content content content"
                "footer footer footer"
                ;
                text-align: center;
                height: 100vh;
                grid-template-rows: 1fr 1fr 1fr 4fr 1fr 1fr 1fr;
            }
            header{
                grid-area: header;
                background-color: yellow;
                margin: 5px;
            }
            div#banner{
                grid-area: banner;
                background-color: red;
                margin: 5px;
            }
            #small {
                display: inline;
            }
            #large {
                display: none;
            }
            section{
                grid-area: section;
                background-color: blue;
                margin: 5px;
            }
            div#content{
                grid-area: content;
                background-color: green;
                margin: 5px;
            }
            aside#left{
                grid-area: leftAside;
                background-color: green;
                margin: 5px;
            }
            aside#right{
                grid-area: rightAside;
                background-color: yellow;
                margin: 5px;
            }
            footer{
                grid-area: footer;
                background-color: blue;
                margin: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header> <h1>Header</h1> </header>
        <div id="banner"> <h1>Banner</h1> </div>
        <section> <h1>Main contant</h1> <p id="large">Width: 916, Height: 873</p> <p id="small">Width: 437, Height:873</p> </section>
        <div id="content"> <h1>Low Content</h1> </div>
        <aside id="left"> <h1>Left Aside</h1> </aside>
        <aside id="right"> <h1>Right Aside</h1> </aside>
        <footer> <h1>Footer</h1> </footer>
    </div>
</body>
</html>
