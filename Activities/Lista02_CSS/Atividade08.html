<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 8</title>
    <style>
        body{
            margin: 0;
        }
        div.container{
            display: grid;
            grid-template-areas: 
            "d1 d1 d1 d2 d2"
            "d3 d4 d5 d6 d7"
            "d3 d8 d8 d8 d9"
            "d3 d10 d10 d10 d9"
            ;
            height: 100vh;
            grid-template-rows: 1fr 1fr 1fr 3fr;
            grid-template-columns: 5fr 1fr 1fr 1fr 1fr;
        }
        div.container>div{
            margin: 3px;
        }
        div#d1{
            grid-area: d1;
            background-color: yellow;
        }
        div#d2{
            grid-area: d2;
            background-color: blue;
        }
        div#d3{
            grid-area: d3;
            background-color: orange;
        }
        div#d4{
            grid-area: d4;
            background-color: green;
            border-radius: 50%;
            aspect-ratio: 1;
        }
        div#d5{
            grid-area: d5;
            background-color: salmon;
            border-radius: 50%;
            aspect-ratio: 1;
        }
        div#d6{
            grid-area: d6;
            background-color: purple;
            border-radius: 50%;
            aspect-ratio: 1;
        }
        div#d7{
            grid-area: d7;
            background-color: orange;
            border-radius: 50%;
            aspect-ratio: 1;
        }
        div#d8{
            grid-area: d8;
            background-color: blue;
        }
        div#d9{
            grid-area: d9;
            background-color: green;
        }
        div#d10{
            grid-area: d10;
            background-color:salmon ;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
        <div id="d5"></div>
        <div id="d6"></div>
        <div id="d7"></div>
        <div id="d8"></div>
        <div id="d9"></div>
        <div id="d10"></div>
    </div>
</body>
</html>
