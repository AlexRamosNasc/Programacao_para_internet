<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        body{
            margin: 0;
        }
        h1{
            color: aliceblue;
            font-size:large;
            margin-top: 15px;
        }
        p#p1{
            margin-left: 40px;
        }
        p{
            background-color:cadetblue;
            height: 50px;
            width: 50px;
            margin-right: 20px;
            border-radius: 25px;
        }
        div.container{
            display: flex;
            height: 80vh;
        }
        div.conteudo{
            display: flex;
            flex-direction: column;
            width: 100vw;
        }
        div#barra{
            display: flex;
            flex-direction: row;
            align-items: center;
            height: 20vh;
            background-color: black;
        }
        div#navega{
            display: flex;
            flex-direction: column;
            width: 25vh;
            background-color: chocolate;
            align-items: center;
        }
        div.container>div header{
            display: flex;
            justify-content: center;
            background-color:cornflowerblue;
            height: 20vh;
        }
        div.container>div section{
            display: flex;
            justify-content: center;
            background-color:blueviolet;
            height: 60vh;
        }
        div.container>div footer{
            display: flex;
            justify-content: center;
            background-color:cornflowerblue;
            height: 20vh;
            
        }
    </style>
</head>
<body>
    <div id="barra"> <p id="p1"></p> <p></p> <p></p> </div>
    <div class="container">
        

        <div id="navega"> <h1>NAVEGAÇÃO</h1> </div>

        <div class="conteudo">
            <header> <h1>CABEÇALHO</H1> </header>
            <section> <h1>CONTEÚDO</h1> </section>
            <footer> <h1>RODAPÉ</h1> </footer>
        </div>
    </div>
    
    
    
</body>
</html>
