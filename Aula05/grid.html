<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{border: 1px solid black;}
        .main{
            display: grid;
            grid-template-areas: 
            "header header header"
            "menu secao aside"
            "rodape rodape rodape"
            ;
            grid-template-rows: 25vh 50vh 25vh;
            text-align: center;
        }
        header{
            grid-area: header;
        }
        section{
            grid-area: secao;
        }
        aside{
            grid-area: aside;
        }
        div{
            grid-area: menu;
        }
        footer{
            grid-area: rodape;
        }
        .text{
            align-content: center;
        }
    </style>
</head>
<body>
    <div class="main">
        <header class="text">header</header>
        <div class="text">menu</div>
        <section class="text">seção</section>
        <aside class="text">aside</aside>
        <footer class="text">rodapé</footer>
    </div>
</body>
</html>
